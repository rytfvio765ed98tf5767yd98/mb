  <script>
    const slider = document.getElementById('featuredSlider');
    const slides = slider.querySelectorAll('.slide');
    let currentIndex = 0;
    let slideInterval;
    const intervalTime = 3500;

    function goToSlide(index) {
      if (!slides[currentIndex]) return;
      slides[currentIndex].classList.remove('active');
      currentIndex = index;
      slides[currentIndex].classList.add('active');
    }

    function nextSlide() {
      let nextIndex = (currentIndex + 1) % slides.length;
      goToSlide(nextIndex);
    }

    function startSlider() {
      stopSlider(); 
      slideInterval = setInterval(nextSlide, intervalTime);
    }

    function stopSlider() {
      clearInterval(slideInterval);
    }

    startSlider();

    slider.addEventListener('mouseenter', stopSlider);
    slider.addEventListener('mouseleave', startSlider);

    
    const horizontalGallery = document.getElementById('horizontal-gallery');
    const totalHorizontalPhotos = 3; 
    const horizontalBasePath = "images/index/";

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    if (horizontalGallery) {
      for (let i = 1; i <= totalHorizontalPhotos; i++) {
        const card = document.createElement('div');
        card.className = 'horizontal-film-card';

        const formattedNum = i < 10 ? '0' + i : i;

        const topMeta = document.createElement('div');
        topMeta.className = 'film-meta-top';
        topMeta.innerHTML = `<span>FRAME |${formattedNum}|</span><span>2026</span>`;

        const filmInner = document.createElement('div');
        filmInner.className = 'horizontal-film-inner';

      if (i === 2) {
          filmInner.id = 'middle-film-inner';
          const img = document.createElement('img');
          img.src = `${horizontalBasePath}2.webp`;
          img.alt = `Film Frame ${i}`;
          img.loading = "lazy";
          filmInner.appendChild(img);
        } else {
          const img = document.createElement('img');
          const imgIndex = ((i - 1) % 3) + 1;
          img.src = `${horizontalBasePath}${imgIndex}.webp`; 
          img.alt = `Film Frame ${i}`;
          img.loading = "lazy";
          filmInner.appendChild(img);

          card.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
          });
        }

        const bottomMeta = document.createElement('div');
        bottomMeta.className = 'film-meta-bottom';
        bottomMeta.innerHTML = `<span>mb</span><span>digital</span>`;

        card.appendChild(topMeta);
        card.appendChild(filmInner);
        card.appendChild(bottomMeta);

        horizontalGallery.appendChild(card);
      }
    }

function initLichenEmbedScroll() {
  const middleInner = document.getElementById('middle-film-inner');
  if (!middleInner) return;

  let loaded = false;
  let refreshInterval = null;

  function loadLichen() {
    const existingIframe = middleInner.querySelector('iframe');
    const initialImg = middleInner.querySelector('img');

    if (existingIframe) {

      existingIframe.style.opacity = '0';
      setTimeout(() => {
        existingIframe.src = `lichen.html?t=${Date.now()}`;
        existingIframe.onload = () => {
          existingIframe.style.opacity = '1';
        };
      }, 300);
    } else if (initialImg) {

      initialImg.style.opacity = '0';
      setTimeout(() => {
        middleInner.innerHTML = `<iframe src="lichen.html?t=${Date.now()}" title="Lichen"></iframe>`;
        const iframe = middleInner.querySelector('iframe');
        iframe.onload = () => {
          iframe.classList.add('loaded');
        };
      }, 400);
    }
  }

  window.addEventListener('scroll', () => {
    if (loaded) return;
    const rect = middleInner.getBoundingClientRect();
    const windowHeight = window.innerHeight;

    if (rect.top <= windowHeight * 0.5 && rect.bottom >= 0) {
      loaded = true;
      loadLichen();

      refreshInterval = setInterval(loadLichen, 10000);
    }
  }, { passive: true });
}

    if (lightboxClose) {
      lightboxClose.addEventListener('click', () => {
        lightbox.classList.remove('active');
      });
    }

    if (lightbox) {
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          lightbox.classList.remove('active');
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox) {
        lightbox.classList.remove('active');
      }
    });
      
async function fetchRandomQuote() {
  const quoteDisplay = document.getElementById("quote-display");
  try {
    const response = await fetch('quotes.txt?t=' + Date.now());
    const text = await response.text();
    const lines = text.split('\n').filter(line => line.trim() !== '');
    if (lines.length > 0) {
      const randomLine = lines[Math.floor(Math.random() * lines.length)];
      quoteDisplay.textContent = randomLine;
    }
  } catch (e) { console.log("Quotes file not found"); }
}

async function fetchRecentActivity() {
  const widgetContent = document.getElementById("widget-content");
  if (!widgetContent) return;
  try {
    const [writingsRes, worksRes] = await Promise.all([
      fetch('./writings.html?t=' + Date.now()),
      fetch('./works.html?t=' + Date.now())
    ]);
    const writingsHtml = writingsRes.ok ? await writingsRes.text() : "";
    const worksHtml = worksRes.ok ? await worksRes.text() : "";
    const parser = new DOMParser();
    const items = [];

    if (writingsHtml) {
      const docW = parser.parseFromString(writingsHtml, 'text/html');
      docW.querySelectorAll('.article-link').forEach(art => {
        const title = art.querySelector('h3')?.textContent || 'Untitled';
        const href = art.getAttribute('href');
        const dateStr = art.querySelector('.article-meta-row span')?.textContent.trim() || "";
        items.push({ title, dateStr, href, type: 'writing' });
      });
    }

    if (worksHtml) {
      const docWorks = parser.parseFromString(worksHtml, 'text/html');
      docWorks.querySelectorAll('.work-link').forEach(work => {
        const dateStrRaw = work.querySelector('.meta')?.textContent.split('|')[0].trim() || "";
        if (dateStrRaw.includes('3000')) return; 
        const title = work.querySelector('h3')?.textContent.replace('[pinned]', '').trim() || 'Untitled Work';
        const href = work.getAttribute('href');
        items.push({ title, dateStr: dateStrRaw, href, type: 'work' });
      });
    }

    const sortedActivity = items.map(item => {
      let timestamp = 0;
      if (item.dateStr.includes('.')) {
        const parts = item.dateStr.split('.');
        if (parts.length === 3) { timestamp = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime(); }
      }
      return { ...item, timestamp };
    })
    .filter(item => item.timestamp > 0) 
    .sort((a, b) => b.timestamp - a.timestamp)
    .slice(0, 3);

    widgetContent.innerHTML = '';
    if (sortedActivity.length === 0) {
      widgetContent.innerHTML = '<p style="font-size:10px; color:#555; padding:10px;">No activity found.</p>';
      return;
    }

    sortedActivity.forEach((item, index) => {
      let prefix = '';
      if (item.type === 'work') { prefix = '⧉&nbsp;| '; } 
      else if (item.type === 'writing') { prefix = '✎&nbsp;| '; }
      
      const isNewest = index === 0 ? ' newest' : '';
      
      widgetContent.innerHTML += `
        <a href="${item.href}" class="widget-item${isNewest}">
          <span class="widget-title">${prefix}${item.title}</span>
          <span class="widget-date">${item.dateStr}</span>
        </a>`;
    });
  } catch (e) { 
    console.error("Błąd fetch activity:", e);
    widgetContent.innerHTML = '<p style="font-size:10px; color:#555; padding:10px;">Unavailable</p>'; 
  }
}

function initAsciiFade() {
  const overlay = document.getElementById('ascii-fade-overlay');
  const canvas = document.getElementById('ascii-canvas');
  const asciiShades = [" ", "░", "▒", "▓", "█"];
  
  document.addEventListener('click', function(e) {
    const link = e.target.closest('.tile, .mobile-primary-links a');
    if (!link) return;
    if (link.getAttribute('target') === '_blank') return;

    e.preventDefault(); 
    const targetUrl = link.getAttribute('href');
    if (!targetUrl || targetUrl === '#') return;

    overlay.style.display = 'block';
    overlay.style.pointerEvents = 'auto';
    overlay.style.backgroundColor = 'transparent';

    const charWidth = 9.6; 
    const charHeight = 16;
    const cols = Math.ceil(window.innerWidth / charWidth);
    const rows = Math.ceil(window.innerHeight / charHeight);
    
    let matrix = Array.from({ length: rows }, () => new Array(cols).fill(0));

    function render() {
      let text = "";
      for (let r = 0; r < rows; r++) {
        text += matrix[r].map(val => asciiShades[val]).join("") + "\n";
      }
      canvas.textContent = text;
    }

    const totalCells = cols * rows;
    let cellsFinished = 0;
    
    const fadeInterval = setInterval(() => {
      const changesPerTick = Math.ceil(totalCells * 0.12); 

      for (let i = 0; i < changesPerTick; i++) {
        let r = Math.floor(Math.random() * rows);
        let c = Math.floor(Math.random() * cols);
        
        if (matrix[r][c] < asciiShades.length - 1) {
          matrix[r][c]++;
          if (matrix[r][c] === asciiShades.length - 1) {
            cellsFinished++;
          }
        }
      }

      render();

      if (cellsFinished >= totalCells * 0.95) {
        clearInterval(fadeInterval);
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.16)';
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 100);
      }
    }, 30);
  });
}

function initScrollWidgetHide() {
  const widget = document.getElementById('recent-writings-widget');
  const glitchLayer = document.getElementById('widget-glitch-text');
  if (!widget || !glitchLayer) return;

  let lastScrollTop = 0;
  const scrollThreshold = 30;
  let glitchInterval = null;
  const glitchChars = "#░▒▓█";

  function startGlitch() {
    widget.classList.add('glitch-active');
    if (glitchInterval) clearInterval(glitchInterval);
    
    glitchInterval = setInterval(() => {
      let text = "";
      for (let i = 0; i < 45; i++) {
        text += glitchChars[Math.floor(Math.random() * glitchChars.length)];
        if (i % 15 === 0 && i > 0) text += "\n";
      }
      glitchLayer.textContent = text;
    }, 45);
  }

  function stopGlitch() {
    if (glitchInterval) {
      clearInterval(glitchInterval);
      glitchInterval = null;
    }
    widget.classList.remove('glitch-active');
    glitchLayer.textContent = "";
  }

  window.addEventListener('scroll', function() {
    let currentScrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const isNearBottom = (window.innerHeight + currentScrollTop) >= (document.documentElement.scrollHeight - 120);

    if (isNearBottom) {
      if (!widget.classList.contains('scroll-hidden')) {
        startGlitch();
        widget.classList.add('scroll-hidden');
        setTimeout(stopGlitch, 350);
      }
      return;
    }

    if (currentScrollTop > lastScrollTop && currentScrollTop > scrollThreshold) {
      if (!widget.classList.contains('scroll-hidden')) {
        startGlitch();
        widget.classList.add('scroll-hidden');
        setTimeout(stopGlitch, 350);
      }
    } 
    else if (currentScrollTop < lastScrollTop) {
      if (widget.classList.contains('scroll-hidden')) {
        widget.classList.remove('scroll-hidden');
        startGlitch();
        setTimeout(stopGlitch, 350);
      }
    }

    lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
  }, { passive: true });
}
    
window.addEventListener('load', function() {
  const preloader = document.getElementById('preloader');
  fetchRandomQuote();
  fetchRecentActivity(); 
  initAsciiFade(); 
  initScrollWidgetHide();
  initLichenEmbedScroll(); 
  setTimeout(() => { if(preloader) preloader.classList.add('hidden'); }, 4000);
});
