<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>rss | maja braumberger</title>
    

    <link rel="alternate" type="application/rss+xml" title="maja braumberger" href="https://majabraumberger.com/rss.xml" />
    
    <style>
        * { 
            box-sizing: border-box; 
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 80px 24px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container { 
            max-width: 720px; 
            width: 100%; 
        }
        header { 
            border-bottom: 1px solid #222222; 
            padding-bottom: 32px; 
            margin-bottom: 48px; 
        }
        h1 { 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 600; 
            letter-spacing: -0.5px; 
            text-transform: lowercase; 
            margin: 0; 
        }
        .subtitle { 
            font-size: 14px; 
            color: #888888; 
            margin-top: 10px; 
            text-transform: lowercase; 
            letter-spacing: 0px;
            line-height: 1.5;
            font-weight: 400;
        }
        
   
        .rss-subscribe-box {
            background: #141414;
            border: 1px solid #262626;
            padding: 18px 20px;
            border-radius: 6px;
            margin-bottom: 40px;
            font-size: 13px;
            color: #999999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .rss-subscribe-box code {
            color: #ffffff;
            background: #1f1f1f;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
        }
        .copy-btn {
            background: #262626;
            color: #ffffff;
            border: 1px solid #383838;
            padding: 8px 14px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 0.2px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .copy-btn:hover {
            background: #383838;
            border-color: #555555;
        }

        .feed-list { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .item {
            background: #121212;
            padding: 28px;
            border: 1px solid #222222;
            border-radius: 6px;

            transition: border-color 0.2s ease, background 0.2s ease;
            text-decoration: none;
            display: block;
        }
        .item:hover { 
            background: #171717; 
            border-color: #444444; 
        }
        .item-meta { 
            font-size: 12px; 
            color: #777777; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            margin-bottom: 10px; 
            display: block; 
            font-weight: 500;
        }
        .item-title { 
            color: #ffffff; 
            font-size: 18px; 
            font-weight: 600; 
            display: block; 
            margin-bottom: 12px; 
            letter-spacing: -0.3px; 
            line-height: 1.4; 
        }
        .item-desc { 
            font-size: 15px; 
            line-height: 1.65; 
            color: #b0b0b0; 
            font-weight: 400; 
        }
        .item-desc p { margin: 0 0 10px 0; }
        .item-desc p:last-child { margin-bottom: 0; }
        .item-desc a { color: #ffffff; text-decoration: underline; }

        .back-link { 
            display: inline-block; 
            margin-top: 48px; 
            color: #777777; 
            text-decoration: none; 
            font-size: 13px; 
            letter-spacing: 0.5px; 
            transition: color 0.2s ease; 
            font-weight: 500;
        }
        .back-link:hover { 
            color: #ffffff; 
        }

        @media (max-width: 600px) {
            body { padding: 40px 16px; }
            h1 { font-size: 22px; }
            .item { padding: 20px; }
            .item-title { font-size: 16px; }
            .item-desc { font-size: 14px; }
            .rss-subscribe-box { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>maja braumberger</h1>
            <div class="subtitle">a poke in the eye with a light beam</div>
        </header>

        <div class="rss-subscribe-box">
            <span>subscribe via rss reader: <code id="rss-url">https://majabraumberger.com/rss.xml</code></span>
            <button class="copy-btn" onclick="copyRssUrl()" id="copy-btn">copy feed url</button>
        </div>
        
        <main class="feed-list" id="feed-container">
            <div style="color: #666; font-size: 14px;">ładowanie wpisów...</div>
        </main>
        
        <footer>
            <a href="index.html" class="back-link">← return to home</a>
        </footer>
    </div>

    <script>
        function copyRssUrl() {
            const url = document.getElementById("rss-url").innerText;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "copied!";
                setTimeout(() => { btn.innerText = "copy feed url"; }, 2000);
            });
        }

        fetch('rss.xml')
            .then(response => response.text())
            .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
            .then(data => {
                const items = data.querySelectorAll("item");
                const container = document.getElementById("feed-container");
                container.innerHTML = "";

                items.forEach(el => {
                    const title = el.querySelector("title").textContent;
                    const link = el.querySelector("link").textContent;
                    const description = el.querySelector("description").textContent;
                    const pubDate = el.querySelector("pubDate").textContent;

                    const htmlItem = `
                        <a class="item" href="${link}">
                            <span class="item-meta">${pubDate}</span>
                            <span class="item-title">${title}</span>
                            <div class="item-desc">${description}</div>
                        </a>
                    `;
                    container.innerHTML += htmlItem;
                });
            })
            .catch(err => {
                document.getElementById("feed-container").innerHTML = '<span style="color: #ff6b6b;">Nie udało się załadować wpisów RSS.</span>';
            });
    </script>
</body>
</html>
